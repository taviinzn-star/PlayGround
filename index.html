<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ruas do Brasil</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87c7df;font-family:Arial,Helvetica,sans-serif}canvas{display:block;width:100%;height:100%}
#loading{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#f4c84a 0%,#df6b38 55%,#1d5573 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;color:white;text-align:center}.logo{font-size:62px;font-weight:900;letter-spacing:-5px;text-transform:uppercase;text-shadow:3px 5px 0 #16374d}.logo span{color:#f9ca24}.logo small{display:block;font-size:16px;letter-spacing:8px;margin-top:-8px}.bar{width:280px;height:8px;background:#ffffff55;margin-top:25px;border-radius:10px;overflow:hidden}.bar i{display:block;width:20%;height:100%;background:white;animation:load 1.2s linear forwards}@keyframes load{to{width:100%}}
#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:1px 2px 2px #000}.top{position:absolute;top:16px;left:18px}.brand{font-size:18px;font-weight:900}.brand b{color:#f8cf35}.stats{display:flex;gap:8px;margin-top:8px}.pill{background:#101820cc;border-left:3px solid #efc62f;padding:7px 10px;font-weight:700;font-size:13px}.wanted{position:absolute;right:18px;top:18px;background:#101820cc;padding:9px 13px;border-radius:4px}.wanted i{font-style:normal;color:#75808a}.wanted i.hot{color:#ffb000}
#mission{position:absolute;left:18px;bottom:28px;width:270px;background:#101820d9;border-left:4px solid #f2ca37;padding:12px 14px}.missionTitle{font-size:11px;color:#f2ca37;font-weight:bold;letter-spacing:1.5px}.missionName{font-size:17px;font-weight:bold;margin:4px 0}.missionText{font-size:12px;color:#ddd}.distance{color:#62c9ff;font-weight:bold}
#minimap{position:absolute;right:18px;bottom:18px;width:170px;height:170px;border:4px solid #101820;border-radius:50%;background:#668759;overflow:hidden}.mapinner{position:absolute;inset:0;background:linear-gradient(90deg,transparent 46%,#c6b47b 46%,#c6b47b 54%,transparent 54%),linear-gradient(0deg,transparent 44%,#c6b47b 44%,#c6b47b 52%,transparent 52%);background-size:65px 65px}.arrow{position:absolute;left:77px;top:78px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:22px solid #f8cf35;filter:drop-shadow(1px 2px 1px #111);transform-origin:8px 18px}.mapdot{position:absolute;width:8px;height:8px;border-radius:50%;background:#40baff;right:48px;top:28px}
#prompt{position:absolute;left:50%;bottom:38px;transform:translateX(-50%);background:#101820e8;padding:9px 16px;border-radius:3px;font-weight:bold;display:none}
#creator{position:absolute;inset:0;z-index:40;background:linear-gradient(90deg,#101820cc 0%,#10182099 55%,transparent);display:flex;align-items:center;padding:7vw;color:white}.creatorCard{width:380px}.creatorCard h1{font-size:44px;margin:0 0 4px}.creatorCard p{color:#ddd}.creatorCard button{border:0;padding:11px 16px;margin:5px 5px 5px 0;background:#f1c935;color:#111;font-weight:bold;cursor:pointer}.creatorCard .start{background:#32b7db;width:100%;font-size:16px;margin-top:18px}.skinRow{display:flex}.swatch{width:42px;height:42px;border:3px solid #fff5;border-radius:50%;cursor:pointer;margin:7px}.swatch.selected{border-color:#f6ce34}.choice{display:inline-block;margin:5px;background:#ffffff18;padding:10px 12px;cursor:pointer}.choice.selected{background:#f1c935;color:#111}
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#101820dd;padding:12px 20px;border-radius:4px;display:none;font-weight:bold}
.mobile{display:none}.joystick{position:absolute;left:18px;bottom:210px;width:120px;height:120px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff44}.knob{position:absolute;width:48px;height:48px;border-radius:50%;background:#ffffff66;left:36px;top:36px}.actions{position:absolute;right:18px;bottom:210px}.act{width:64px;height:64px;border-radius:50%;border:2px solid #fff8;background:#10182088;color:white;font-weight:bold;margin:8px;pointer-events:auto}
@media(max-width:760px){.wanted{top:10px}.top{top:10px}.stats{display:none}#minimap{width:120px;height:120px;bottom:10px}#mission{bottom:10px;width:220px}.arrow{left:52px;top:53px}.mobile{display:block}.top{transform:scale(.9);transform-origin:left top}.brand{font-size:15px}.creatorCard{width:90%;}.creatorCard h1{font-size:34px}}
</style>
</head>
<body>
<div id="loading"><div class="logo">Ruas do <span>Brasil</span><small>VIDA REAL</small></div><div class="bar"><i></i></div></div>
<div id="creator"><div class="creatorCard"><h1>Crie seu personagem</h1><p>Comece sua história nas ruas de Porto Dourado.</p><label>Tom de pele</label><div class="skinRow"><div class="swatch selected" data-c="0xd6a46d" style="background:#d6a46d"></div><div class="swatch" data-c="0xb96f45" style="background:#b96f45"></div><div class="swatch" data-c="0x6f3f29" style="background:#6f3f29"></div><div class="swatch" data-c="0xf1c6a5" style="background:#f1c6a5"></div></div><label>Estilo</label><div><div class="choice selected" data-style="0">Verão</div><div class="choice" data-style="1">Favela</div><div class="choice" data-style="2">Esporte</div></div><button class="start" id="startBtn">INICIAR HISTÓRIA</button></div></div>
<div id="hud"><div class="top"><div class="brand">RUAS DO <b>BRASIL</b></div><div class="stats"><div class="pill">R$ <span id="cash">250</span></div><div class="pill">♥ <span id="health">100</span></div></div></div><div class="wanted"><span>PROCURA </span><i id="stars">☆☆☆☆☆</i></div><div id="mission"><div class="missionTitle">MISSÃO ATIVA</div><div class="missionName" id="missionName">Primeiro Corre</div><div class="missionText" id="missionText">Chegue ao ponto amarelo no centro.</div><div class="distance" id="distance">— m</div></div><div id="minimap"><div class="mapinner"></div><div class="mapdot"></div><div class="arrow" id="arrow"></div></div><div id="prompt"></div><div id="toast"></div><div class="mobile"><div class="joystick" id="joystick"><div class="knob" id="knob"></div></div><div class="actions"><button class="act" id="enterBtn">E</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),hud=$('#hud');let scene,camera,renderer,clock,player,car=null,mix={};let money=250,health=100,wanted=0,missionStage=0,inCar=false;
const keys={},objects=[],peds=[],cars=[],roadObjects=[];const missionMarker=new THREE.Object3D();
function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.75})}
function box(w,h,d,c,x,y,z){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
function init(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x87c7df);scene.fog=new THREE.Fog(0x87c7df,100,260);
 camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,500);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
 clock=new THREE.Clock();
 const amb=new THREE.HemisphereLight(0xddeeff,0x557744,2.1);scene.add(amb);const sun=new THREE.DirectionalLight(0xfff2d2,2.4);sun.position.set(-60,90,40);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-100;sun.shadow.camera.right=100;sun.shadow.camera.top=100;sun.shadow.camera.bottom=-100;scene.add(sun);
 const ground=box(260,.5,260,0x62a34d,0,-.25,0);ground.receiveShadow=true;
 createCity();createPlayer(0xd6a46d,0);createCar(-9,0,8,0x32b7db);createMissionMarker();createPeds();createTraffic();
 setTimeout(()=>{$('#loading').style.display='none'},1500);
 animate();
}
function createCity(){
 // road grid
 for(let i=-120;i<=120;i+=30){box(260,.12,13,0x34393a,0,.02,i);box(260,.04,1,0xe0c55a,0,.09,i,);}
 for(let i=-120;i<=120;i+=30){box(13,.12,260,0x34393a,i,.02,0)}
 // continuous lane marks
 for(let i=-120;i<120;i+=8){for(let r of [-105,-75,-45,-15,15,45,75,105]){box(.18,.05,4,0xf4c94c,r,.1,i)}}
 // buildings, favela, beach, Christ-like landmark
 for(let gx=-105;gx<=105;gx+=30)for(let gz=-105;gz<=105;gz+=30){
  if(Math.abs(gx)<18&&Math.abs(gz)<18)continue;let b=7+Math.random()*22;if(gx>65&&gz>35){b=4+Math.random()*7}
  let colors=[0xdeb887,0xbda6c7,0x8eaeb5,0xe6c4a1,0x8fa17e];let h=box(16,b,16,colors[(Math.abs(gx/30)+Math.abs(gz/30))%colors.length|0],gx+(Math.random()*3-1.5),b/2,gz+(Math.random()*3-1.5));
  roadObjects.push(h);
 }
 // beach to south
 box(260,.3,24,0xe7c875,0,.05,125);box(260,.2,18,0x2ea9ce,0,.1,145);
 // palm trees
 for(let i=-110;i<110;i+=18){let trunk=box(.8,7,.8,0x81623e,i,3.5,112);let leaf=new THREE.Mesh(new THREE.ConeGeometry(5,.8,5),mat(0x2f7e3f));leaf.position.set(i,8,112);leaf.rotation.z=.15;scene.add(leaf)}
 // Sugarloaf-inspired landmark
 let base=box(14,22,14,0x9aa58c,-105,11,105);let peak=new THREE.Mesh(new THREE.ConeGeometry(11,35,8),mat(0x777f6d));peak.position.set(-105,39.5,105);peak.castShadow=true;scene.add(peak);
 // colorful favela houses
 for(let x=-95;x<-70;x+=7)for(let z=55;z<95;z+=7){if(Math.random()<.65)box(5,3+Math.random()*5,5,[0xef6b61,0xf7c85a,0x5dbb63,0x6eb9df][(x+z)%4|0],x,2,z)}
 // trees and kiosks
 for(let i=-115;i<=115;i+=25){let t=box(.5,4,.5,0x705136,i,2,70);let c=new THREE.Mesh(new THREE.SphereGeometry(3,7,6),mat(0x3b8038));c.position.set(i,6,70);scene.add(c)}
}
function createPlayer(skin,style){if(player)scene.remove(player);player=new THREE.Group();let shirt=[0x1a76a7,0xdde45b,0x2f4152][style];let pants=style===1?0x333333:0x20242b;let body=new THREE.Mesh(new THREE.BoxGeometry(1.25,2.4,0.7),mat(shirt));body.position.y=3.2;player.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.65,12,8),mat(skin));head.position.y=5.25;player.add(head);let hair=new THREE.Mesh(new THREE.SphereGeometry(.67,12,6,0,Math.PI*2,0,Math.PI*.48),mat(style===1?0x202020:0x402919));hair.position.y=5.55;player.add(hair);for(let x of [-.38,.38]){let leg=new THREE.Mesh(new THREE.BoxGeometry(.55,2.2,.6),mat(pants));leg.position.set(x,1.15,0);player.add(leg)}player.position.set(0,0,0);scene.add(player)}
function createCar(x,y,z,c){let g=new THREE.Group();let base=new THREE.Mesh(new THREE.BoxGeometry(3.5,1,7),mat(c));base.position.y=1.1;g.add(base);let roof=new THREE.Mesh(new THREE.BoxGeometry(2.8,1.2,3.5),mat(c));roof.position.set(0,2, -.5);g.add(roof);let glass=new THREE.Mesh(new THREE.BoxGeometry(2.82,.85,3.55),mat(0x172a35));glass.position.set(0,2.15,-.5);g.add(glass);for(let a of [-1.35,1.35])for(let b of [-2.3,2.3]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.65,.65,.4,12),mat(0x111111));w.rotation.z=Math.PI/2;w.position.set(a,.65,b);g.add(w)}g.position.set(x,y,z);g.userData={drivable:true,speed:0,dir:0};scene.add(g);cars.push(g);return g}
function createPeds(){let colors=[0x5ca65c,0xe0a070,0x7296c9,0xe05b5b,0xe8ca57];for(let i=0;i<55;i++){let g=new THREE.Group();let skin=[0xd6a46d,0xb96f45,0x6f3f29,0xf1c6a5][i%4];let body=new THREE.Mesh(new THREE.BoxGeometry(.8,1.8,.5),mat(colors[i%colors.length]));body.position.y=2.1;g.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.45,8,6),mat(skin));head.position.y=3.35;g.add(head);let x=(Math.random()*200-100),z=(Math.random()*200-100);if(Math.abs(x)<15)x+=(x<0?-18:18);g.position.set(x,0,z);g.userData={baseX:x,baseZ:z,phase:Math.random()*6,dir:new THREE.Vector3(Math.random()-.5,0,Math.random()-.5).normalize(),speed:.7+Math.random()*.7};scene.add(g);peds.push(g)}}
function createTraffic(){for(let i=0;i<18;i++){let x=i%2?-105+(i*11)%210: -105+(i*13)%210;let z=i%2?-105+(i*17)%210:-105+(i*11)%210;let c=createCar(x,0,z,[0xe36b5b,0xf1c84d,0x2d83bd,0xf5f5f5][i%4]);c.userData={traffic:true,speed:3+(i%4),axis:i%2?'x':'z',dir:i%3?1:-1}}}
function createMissionMarker(){let ring=new THREE.Mesh(new THREE.TorusGeometry(3,.35,8,24),mat(0xf2ca37));ring.position.set(0,1,35);ring.rotation.x=Math.PI/2;scene.add(ring);missionMarker.add(ring)}
function updateCharacter(dt){if(inCar&&car){let s=0;if(keys.ArrowUp||keys.KeyW)s=18;if(keys.ArrowDown||keys.KeyS)s=-12;car.userData.speed+=(s-car.userData.speed)*dt*2;let steer=0;if(keys.ArrowLeft||keys.KeyA)steer=1;if(keys.ArrowRight||keys.KeyD)steer=-1;car.rotation.y+=steer*dt*1.6*(car.userData.speed/10);car.translateZ(car.userData.speed*dt);car.position.x=Math.max(-125,Math.min(125,car.position.x));car.position.z=Math.max(-125,Math.min(125,car.position.z));player.position.copy(car.position);return}
 let move=new THREE.Vector3();if(keys.KeyW||keys.ArrowUp)move.z-=1;if(keys.KeyS||keys.ArrowDown)move.z+=1;if(keys.KeyA||keys.ArrowLeft)move.x-=1;if(keys.KeyD||keys.ArrowRight)move.x+=1;if(move.length()){move.normalize();let speed=14*dt;player.position.add(move.multiplyScalar(speed));let ang=Math.atan2(move.x,move.z);player.rotation.y=ang}player.position.x=Math.max(-125,Math.min(125,player.position.x));player.position.z=Math.max(-125,Math.min(125,player.position.z));
}
function updatePeds(dt,t){peds.forEach(p=>{p.position.addScaledVector(p.userData.dir,p.userData.speed*dt);if(Math.abs(p.position.x-p.userData.baseX)>30||Math.abs(p.position.z-p.userData.baseZ)>30)p.userData.dir.multiplyScalar(-1);p.rotation.y=Math.atan2(p.userData.dir.x,p.userData.dir.z)})
 cars.forEach(c=>{if(!c.userData.traffic)return;let d=c.userData.dir*c.userData.speed*dt;if(c.userData.axis==='z'){c.position.z+=d;if(Math.abs(c.position.z)>125)c.position.z=-125*c.userData.dir;c.rotation.y=d>0?0:Math.PI}else{c.position.x+=d;if(Math.abs(c.position.x)>125)c.position.x=-125*c.userData.dir;c.rotation.y=d>0?-Math.PI/2:Math.PI/2}})
}
function updateMission(){let target;let dist;if(missionStage===0){target=new THREE.Vector3(0,0,35);dist=player.position.distanceTo(target);$('#distance').textContent=Math.round(dist)+' m';if(dist<5){missionStage=1;$('#missionName').textContent='Motor Elétrico';$('#missionText').textContent='Entre no carro azul com E ou o botão.';missionMarker.children[0].position.set(-9,1,8);toast('Missão atualizada: motorista elétrico')}}else if(missionStage===1){dist=player.position.distanceTo(car.position);$('#distance').textContent=Math.round(dist)+' m';if(inCar){missionStage=2;$('#missionName').textContent='Passeio pela orla';$('#missionText').textContent='Leve o carro até a praia no sul.';missionMarker.children[0].position.set(0,1,125);toast('Missão atualizada: passeio pela orla')}}else if(missionStage===2){dist=player.position.distanceTo(new THREE.Vector3(0,0,125));$('#distance').textContent=Math.round(dist)+' m';if(dist<8){missionStage=3;$('#missionName').textContent='História iniciada';$('#missionText').textContent='Explore Porto Dourado livremente.';$('#distance').textContent='Cidade aberta';missionMarker.visible=false;toast('MISSÃO CONCLUÍDA • +R$ 500');money+=500;$('#cash').textContent=money}}}
function toast(txt){let t=$('#toast');t.textContent=txt;t.style.display='block';clearTimeout(t._tm);t._tm=setTimeout(()=>t.style.display='none',2600)}
function toggleCar(){if(inCar){inCar=false;car.userData.speed=0;player.position.copy(car.position).add(new THREE.Vector3(3,0,0));toast('Você saiu do veículo')}else if(player.position.distanceTo(car.position)<7){inCar=true;toast('Veículo elétrico conectado')}}
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;updateCharacter(dt);updatePeds(dt,t);updateMission();
 if(inCar){camera.position.lerp(car.position.clone().add(new THREE.Vector3(-Math.sin(car.rotation.y)*13,8,-Math.cos(car.rotation.y)*13)),.08)}else{let desired=player.position.clone().add(new THREE.Vector3(10,9,12));camera.position.lerp(desired,.07)}camera.lookAt(inCar?car.position:player.position);
 let target=inCar?car.position:player.position;$('#arrow').style.transform=`rotate(${-Math.atan2(target.x, target.z)*180/Math.PI}deg)`;
 if(inCar){$('#prompt').style.display='none'}else if(player.position.distanceTo(car.position)<7){$('#prompt').textDecoration='none';$('#prompt').textContent='E • ENTRAR NO CARRO';$('#prompt').style.display='block'}else $('#prompt').style.display='none';renderer.render(scene,camera)}
window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE')toggleCar()});window.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
$('.swatch').addEventListener('click',e=>{document.querySelectorAll('.swatch').forSelected?.();document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('selected'));e.target.classList.add('selected');mix.skin=parseInt(e.target.dataset.c)});
 document.querySelectorAll('.swatch').forEach(x=>x.onclick=e=>{document.querySelectorAll('.swatch').forEach(y=>y.classList.remove('selected'));x.classList.add('selected');mix.skin=parseInt(x.dataset.c)});document.querySelectorAll('.choice').forEach(x=>x.onclick=()=>{document.querySelectorAll('.choice').forEach(y=>y.classList.remove('selected'));x.classList.add('selected');mix.style=parseInt(x.dataset.style)});
$('#startBtn').onclick=()=>{$('#creator').style.display='none';createPlayer(mix.skin||0xd6a46d,mix.style||0);toast('Bem-vindo a Porto Dourado')};$('#enterBtn').onclick=toggleCar;
// mobile joystick
let joy=$('#joystick'),knob=$('#knob');let jactive=false;joy.addEventListener('pointerdown',e=>{jactive=true;joy.setPointerCapture(e.pointerId)});joy.addEventListener('pointermove',e=>{if(!jactive)return;let r=joy.getBoundingRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.width/2),a=Math.atan2(dy,dx),d=Math.min(38,Math.hypot(dx,dy));knob.style.left=(36+Math.cos(a)*d)+'px';knob.style.top=(36+Math.sin(a)*d)+'px';keys.KeyW=dy<-10;keys.KeyS=dy>10;keys.KeyA=dx<-10;keys.KeyD=dx>10});let end=()=>{jactive=false;knob.style.left='36px';knob.style.top='36px';keys.KeyW=keys.KeyS=keys.KeyA=keys.KeyD=false};joy.addEventListener('pointerup',end);joy.addEventListener('pointercancel',end);
init();
</script>
</body></html>
